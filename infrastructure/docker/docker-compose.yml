version: "3.9"

services:
  # PostgreSQL 17.6 - Primary Database
  postgres:
    image: postgres:17.6-alpine
    container_name: kafka-dotnet-postgres
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - kafka-dotnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 8.0.5 - Cache & Session Store
  redis:
    image: redis:8.0.5-alpine
    container_name: kafka-dotnet-redis
    command: redis-server --requirepass redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kafka-dotnet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka 3.9.1 - KRaft Mode (No Zookeeper)
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka-dotnet-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft Configuration (No Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster Configuration
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Log Configuration
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Performance Tuning
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy

      # JVM Settings
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-dotnet-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kafka UI - Web Interface for Kafka Management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-dotnet-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-dotnet-network

  # pgAdmin - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kafka-dotnet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kafka-dotnet-network

  # Redis Commander - Redis Management Tool
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: kafka-dotnet-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kafka-dotnet-network

  # User Service - .NET 8 API
  userservice:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.userservice
    container_name: kafka-dotnet-userservice
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Database Configuration
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=userservice;Username=postgres;Password=postgres_password"

      # Kafka Configuration
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__GroupId: "userservice-group"
      Kafka__Topics__UserRegistered: "user.registered"
      Kafka__Topics__UserSignedIn: "user.signedin"

      # Redis Configuration
      Redis__ConnectionString: "redis:6379,password=redis_password"
      Redis__InstanceName: "UserService:"

      # JWT Configuration
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: "https://localhost:5001"
      Jwt__SecretKey: "your-secret-key-min-32-chars-for-development-only"
      Jwt__ExpiryMinutes: "60"

      # Microsoft Entra External ID (Replace with actual values)
      AzureAd__Instance: "https://login.microsoftonline.com/"
      AzureAd__TenantId: "your-tenant-id"
      AzureAd__ClientId: "your-client-id"
      AzureAd__Domain: "your-domain.onmicrosoft.com"

      # Logging
      Serilog__MinimumLevel__Default: "Information"
      Serilog__MinimumLevel__Override__Microsoft: "Warning"
      Serilog__MinimumLevel__Override__System: "Warning"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka-dotnet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  kafka-dotnet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
